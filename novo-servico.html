<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Serviço - Thiago Pires</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="center-wrapper">
      <div class="card cadastro-card">
        <div class="cadastro-header">
          <div class="header-content">
            <div class="icon-bolt-large">🔧</div>
            <h1 class="titulo-cadastro">Novo Serviço</h1>
            <a href="painel.html#servicos" class="btn-voltar-home">← Voltar</a>
          </div>
        </div>

        <form id="servicoForm" class="form-container">
          <div class="form-group">
            <label>Cliente *</label>
            <select name="cliente" required>
              <option value="">Selecione o cliente</option>
              <option value="joao">João Silva</option>
              <option value="maria">Maria Santos</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tipo de Serviço *</label>
            <select name="tipo" required>
              <option value="">Selecione</option>
              <option value="instalacao">Instalação Elétrica</option>
              <option value="manutencao">Manutenção</option>
              <option value="reparo">Reparo</option>
              <option value="projeto">Projeto Elétrico</option>
            </select>
          </div>

          <div class="form-group">
            <label>Data *</label>
            <input type="date" name="data" required>
          </div>

          <div class="form-group">
            <label>Horário</label>
            <input type="time" name="horario">
          </div>

          <div class="form-group">
            <label>Endereço do Serviço *</label>
            <textarea name="endereco" rows="3" required></textarea>
          </div>

          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" name="valor" step="0.01">
          </div>

          <button type="submit" class="btn btn-primary full">Agendar Serviço</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    if(!localStorage.getItem('adminLoggedIn')) {
      window.location.href = 'index.html';
    }

    document.getElementById('servicoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('✅ Serviço agendado com sucesso!');
      window.location.href = 'painel.html#servicos';
    });
  </script>
</body>
</html>
