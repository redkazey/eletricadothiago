
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Thiago Pires</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- HEADER CENTRALIZADO - TÍTULO + BOTÃO VOLTAR -->
    <header class="cadastro-header">
      <div class="header-content">
        <div class="icon-bolt-large">⚡</div>
        <h1 class="titulo-cadastro">Cadastro de Cliente</h1>
        <a href="index.html" class="btn-voltar-home">← Voltar ao Home</a>
      </div>
    </header>

    <main class="center-wrapper">
      <section class="card cadastro-card">
        <form id="cadastroForm" class="card-body">
          <div class="form-group"><label>Nome completo</label><input id="nome" required></div>
          <div class="form-group"><label>CPF</label><input id="cpf" required maxlength="14"></div>
          <div class="form-group"><label>Telefone</label><input id="telefone" required maxlength="15"></div>
          <div class="form-group"><label>Email</label><input id="email" type="email" required></div>
          <div class="form-group"><label>CEP</label><input id="cep" required maxlength="9"></div>
          <div class="form-group"><label>Endereço</label><input id="endereco" readonly></div>
          <div class="form-group"><label>Número</label><input id="numero" required></div>
          <div class="form-group"><label>Complemento</label><input id="complemento"></div>
          <div class="form-group"><label>Bairro</label><input id="bairro"></div>
          <div class="form-group"><label>Observação</label><textarea id="observacao"></textarea></div>
          <div class="form-group"><label>Senha</label><input id="senha" type="password" required minlength="6"></div>
          <div class="form-group"><label>Confirme</label><input id="senha2" type="password" required></div>
          <button type="submit" class="btn btn-primary full">CADASTRAR</button>
        </form>
      </section>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
