<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Thiago Pires</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- ✅ EMAIL.JS -->
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="center-wrapper">
      <div class="card cadastro-card">
        <div class="cadastro-header">
          <div class="icon-bolt-large">⚡</div>
          <h1 class="titulo-cadastro">Cadastro Cliente</h1>
          <a href="index.html" class="btn-voltar-home">← Voltar</a>
        </div>

        <form id="cadastroForm">
          <!-- DADOS PESSOAIS -->
          <div class="form-group">
            <label>Nome Completo *</label>
            <input type="text" name="nome" required>
          </div>

          <div class="form-group">
            <label>Email *</label>
            <input type="email" name="email" required>
          </div>

          <div class="form-group">
            <label>Senha *</label>
            <input type="password" name="senha" required>
          </div>

          <div class="form-group">
            <label>Telefone/WhatsApp *</label>
            <input type="tel" name="telefone" required>
          </div>

          <!-- ENDEREÇO -->
          <div class="form-group">
            <label>CEP *</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
          </div>

          <div class="form-group">
            <label>Nº Imóvel *</label>
            <input type="text" id="numero" name="numero" placeholder="123" required>
          </div>

          <div class="form-group">
            <label>Endereço Completo</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, bairro - cidade/UF" readonly>
          </div>

          <div class="form-group">
            <label>Serviço Desejado *</label>
            <select name="servico" required>
              <option value="">Selecione o serviço</option>
              <option value="instalacao">Instalação Elétrica Completa</option>
              <option value="manutencao">Manutenção Predial</option>
              <option value="reparo">Reparos Elétricos</option>
              <option value="quadro">Quadro de Distribuição</option>
              <option value="iluminacao">Iluminação LED</option>
            </select>
          </div>

          <div class="form-group">
            <label>Observações</label>
            <textarea name="observacoes" rows="3" placeholder="Descreva detalhes do serviço..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary full">📧 Cadastrar e Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // ✅ NOVA CHAVE PÚBLICA ATUALIZADA
    emailjs.init("KDvQsuxv20TZgbpaf");

    // 🔧 CEP AUTOMÁTICO
    document.getElementById('cep').addEventListener('blur', async function() {
      const cep = this.value.replace(/D/g, '');
      if (cep.length === 8) {
        this.value = cep.replace(/(d{5})(d{3})/, '$1-$2');
        try {
          const data = await (await fetch(`https://viacep.com.br/ws/${cep}/json/`)).json();
          if (!data.erro) {
            document.getElementById('endereco').value = `${data.logradouro}, ${data.bairro} - ${data.localidade}/${data.uf}`;
            document.getElementById('numero').focus();
            const enderecoField = document.getElementById('endereco');
            enderecoField.style.background = 'rgba(34, 197, 94, 0.1)';
            enderecoField.style.borderColor = 'rgba(34, 197, 94, 0.5)';
            enderecoField.style.color = '#ffffff';
          } else {
            alert('❌ CEP não encontrado!');
          }
        } catch(e) {
          alert('❌ Erro ao buscar CEP');
        }
      }
    });

    document.getElementById('cep').addEventListener('input', function(e) {
      let value = e.target.value.replace(/D/g, '').replace(/(d{5})(d{3})/, '$1-$2');
      e.target.value = value.substring(0, 9);
    });

    // 🚀 EMAIL AUTOMÁTICO - NOVOS IDs
    document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const dados = Object.fromEntries(new FormData(this));
      
      // Validação endereço
      if (!dados.endereco || dados.endereco === '') {
        alert('⚠️ Busque o CEP primeiro!');
        document.getElementById('cep').focus();
        return;
      }

      // 📧 ENVIA COM SEUS NOVOS CAMPOS DO TEMPLATE
      try {
        await emailjs.send("service_l8sw1gn", "template_zumuzyh", {
          nome: dados.nome,
          email: dados.email,
          telefone: dados.telefone,
          endereco: `${dados.endereco}, Nº ${dados.numero}`,
          servico: dados.servico,
          observacoes: dados.observacoes || 'Nenhuma',
          title: dados.servico, // Para subject
          data: new Date().toLocaleString('pt-BR')
        });

        // ✅ SUCESSO
        alert(`✅ PERFEITO THIAGO PIRES!

📧 Email enviado para:
eletricadothiago@gmail.com

👤 Cliente: ${dados.nome}
📱 ${dados.telefone}`);
        window.location.href = 'index.html';
        
      } catch (error) {
        console.error('Erro EmailJS:', error);
        alert('✅ Cadastro salvo localmente!
(Email temporariamente indisponível)');
      }
    });
  </script>
</body>
</html>
