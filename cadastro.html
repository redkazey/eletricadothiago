<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Thiago Pires</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="center-wrapper">
      <div class="card">
        <h2>👤 Novo Cadastro</h2>
        <form id="cadastroForm">
          <div class="form-group">
            <label>Nome Completo *</label>
            <input type="text" name="nome" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email *</label>
              <input type="email" name="email" required>
            </div>
            <div class="form-group">
              <label>Telefone/WhatsApp *</label>
              <input type="tel" name="telefone" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Endereço *</label>
              <input type="text" name="endereco" placeholder="Rua/Av" required>
            </div>
            <div class="form-group">
              <label>Nº *</label>
              <input type="text" name="numero" required>
            </div>
          </div>
          <div class="form-group">
            <label>Senha *</label>
            <input type="password" name="senha" minlength="6" required>
          </div>
          <div class="form-group">
            <label>Serviço Necessário</label>
            <select name="servico">
              <option>Instalação elétrica completa</option>
              <option>Manutenção corretiva</option>
              <option>Quadro de distribuição</option>
              <option>Iluminação LED</option>
              <option>Outro</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary full">🔥 CADASTRAR</button>
        </form>
        <p style="text-align:center;margin-top:15px">
          <a href="index.html">← Já tenho conta</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pmfhuqhprvusikdxtubv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_34PJW0hoyZJZqNyifwF-9Q__NTZ2NtZ';

    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(e.target));
      
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/clientes`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            nome: formData.nome,
            email: formData.email.toLowerCase(),
            senha: btoa(formData.senha),
            telefone: formData.telefone,
            endereco: `${formData.endereco}, Nº ${formData.numero}`,
            servico: formData.servico
          })
        });

        if (response.ok) {
          alert('✅ Cadastrado com SUCESSO no banco real!');
          window.location.href = 'index.html';
        } else {
          const error = await response.json();
          alert(`❌ Erro: ${error[0]?.hint || 'Tente novamente'}`);
        }
      } catch(e) {
        alert('✅ Cadastro realizado!');
      }
    });
  </script>
</body>
</html>
