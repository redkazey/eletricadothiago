<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Thiago Pires</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="center-wrapper">
      <div class="card cadastro-card">
        <div class="cadastro-header">
          <div class="icon-bolt-large">⚡</div>
          <h1 class="titulo-cadastro">Cadastro Cliente</h1>
          <a href="index.html" class="btn-voltar-home">← Voltar</a>
        </div>

        <form id="cadastroForm">
          <!-- DADOS PESSOAIS -->
          <div class="form-group">
            <label>Nome Completo *</label>
            <input type="text" name="nome" required>
          </div>

          <div class="form-group">
            <label>Email *</label>
            <input type="email" name="email" required>
          </div>

          <div class="form-group">
            <label>Senha *</label>
            <input type="password" name="senha" required>
          </div>

          <div class="form-group">
            <label>Telefone/WhatsApp *</label>
            <input type="tel" name="telefone" required>
          </div>

          <!-- ENDEREÇO -->
          <div class="form-group">
            <label>CEP *</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
          </div>

          <div class="form-group">
            <label>Nº Imóvel *</label>
            <input type="text" id="numero" name="numero" placeholder="123" required>
          </div>

          <div class="form-group">
            <label>Endereço Completo</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro - cidade/UF" readonly>
          </div>

          <div class="form-group">
            <label>Serviço Desejado *</label>
            <select name="servico" required>
              <option value="">Selecione o serviço</option>
              <option value="instalacao">Instalação Elétrica Completa</option>
              <option value="manutencao">Manutenção Predial</option>
              <option value="reparo">Reparos Elétricos</option>
              <option value="quadro">Quadro de Distribuição</option>
              <option value="iluminacao">Iluminação LED</option>
            </select>
          </div>

          <div class="form-group">
            <label>Observações</label>
            <textarea name="observacoes" rows="3" placeholder="Descreva detalhes do serviço desejado..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary full">Cadastrar e Agendar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // 🔧 CEP AUTOMÁTICO CORRIGIDO (TESTADO)
    document.getElementById('cep').addEventListener('blur', async function() {
      const cep = this.value.replace(/D/g, '');
      
      if (cep.length === 8) {
        // Formatar visualmente
        this.value = cep.replace(/(d{5})(d{3})/, '$1-$2');
        
        try {
          // ✅ VIA CEP API (funciona 100%)
          const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
          const data = await response.json();
          
          if (!data.erro) {
            // ✅ PREENCHER ENDEREÇO AUTOMATICAMENTE
            const enderecoCompleto = `${data.logradouro}, ${data.bairro} - ${data.localidade}/${data.uf}`;
            document.getElementById('endereco').value = enderecoCompleto;
            
            // ✅ PULAR PARA NÚMERO
            document.getElementById('numero').focus();
            
            // ✅ VISUAL VERDE (escuro/preenchido)
            const enderecoField = document.getElementById('endereco');
            enderecoField.style.background = 'rgba(34, 197, 94, 0.1)';
            enderecoField.style.borderColor = 'rgba(34, 197, 94, 0.5)';
            enderecoField.style.color = '#ffffff';
            
          } else {
            alert('❌ CEP não encontrado!');
            document.getElementById('endereco').value = '';
          }
        } catch (error) {
          console.error('Erro CEP:', error);
          alert('❌ Erro ao buscar CEP. Verifique conexão.');
          document.getElementById('endereco').value = '';
        }
      }
    });

    // 🔧 MÁSCARA CEP (99999-999)
    document.getElementById('cep').addEventListener('input', function(e) {
      let value = e.target.value.replace(/D/g, '');
      value = value.replace(/(d{5})(d{3})/, '$1-$2');
      e.target.value = value.substring(0, 9);
    });

    // 🔧 SUBMIT FORMULÁRIO
    document.getElementById('cadastroForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      const dados = Object.fromEntries(formData);
      
      // ✅ VALIDAÇÃO ENDEREÇO
      if (!dados.endereco || dados.endereco === '') {
        alert('⚠️ Preencha o CEP primeiro para buscar o endereço!');
        document.getElementById('cep').focus();
        return;
      }
      
      // ✅ CONFIRMAÇÃO BONITA
      const confirmacao = `✅ CADASTRO REALIZADO!

` +
                         `👤 ${dados.nome}
` +
                         `📧 ${dados.email}
` +
                         `📱 ${dados.telefone}
` +
                         `📍 ${dados.endereco}, ${dados.numero}
` +
                         `💡 ${dados.servico}

` +
                         `📱 Thiago entrará em contato via WhatsApp!`;
      
      alert(confirmacao);
      
      // ✅ REDIRECIONAR
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
