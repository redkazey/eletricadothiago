<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Thiago Pires</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="icon-bolt">⚡</div>
        <h2>ADMIN</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-link active" data-section="dashboard">📊 Dashboard</a>
        <a href="#" class="nav-link" data-section="clientes">👥 Clientes</a>
        <a href="#" class="nav-link" data-section="servicos">🔧 Serviços</a>
        <a href="#" class="nav-link" data-section="orcamentos">💰 Orçamentos</a>
        <a href="#" class="nav-link" data-section="relatorios">📈 Relatórios</a>
        <a href="#" class="nav-link danger" onclick="logout()">🚪 Sair</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <h1>Painel Admin</h1>
        <div class="user-info">
          <span>ADMIN</span>
          <button onclick="logout()" class="btn-logout">Sair</button>
        </div>
      </header>

      <!-- DASHBOARD -->
      <section id="dashboard" class="content-section active">
        <div class="grid-cards">
          <div class="card">
            <h3>Total Clientes</h3>
            <div class="badge badge-primary" id="totalClientes">0</div>
          </div>
          <div class="card">
            <h3>Serviços Hoje</h3>
            <div class="badge badge-success" id="hoje">0</div>
          </div>
          <div class="card">
            <h3>Orçamentos Pendentes</h3>
            <div class="badge badge-warning" id="pendentes">0</div>
          </div>
          <div class="card">
            <h3>Faturamento Mês</h3>
            <div class="badge badge-danger" id="faturamento">R$ 0</div>
          </div>
        </div>
      </section>

      <!-- CLIENTES -->
      <section id="clientes" class="content-section">
        <div class="table-header">
          <h2>Todos Clientes</h2>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Serviço</th><th>Data</th><th>Ações</th></tr>
            </thead>
            <tbody id="clientesTable"></tbody>
          </table>
        </div>
      </section>

      <!-- SERVIÇOS -->
      <section id="servicos" class="content-section">
        <div class="table-header">
          <h2>Todos Serviços</h2>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr><th>Cliente</th><th>Serviço</th><th>Data</th><th>Status</th><th>Valor</th></tr>
            </thead>
            <tbody id="servicosAdminTable"></tbody>
          </table>
        </div>
      </section>

      <!-- RELATÓRIOS -->
      <section id="relatorios" class="content-section">
        <div class="config-section">
          <h3>📊 Relatórios</h3>
          <button class="btn btn-primary" onclick="gerarPDF('semanal')">📋 Semanal PDF</button>
          <button class="btn btn-primary" onclick="gerarPDF('mensal')">📅 Mensal PDF</button>
          <button class="btn btn-success" onclick="exportCSV()">📊 Export CSV</button>
        </div>
        <div id="relatorioPreview"></div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://pmfhuqhprvusikdxtubv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_34PJW0hoyZJZqNyifwF-9Q__NTZ2NtZ';

    if (localStorage.getItem('userType') !== 'admin') {
      window.location.href = 'index.html';
    }

    async function loadAdmin() {
      const [clientes, servicos, orcamentos] = await Promise.all([
        fetchData('clientes', 'deleted_at=isnull'),
        fetchData('servicos', 'deleted_at=isnull'),
        fetchData('orcamentos', 'deleted_at=isnull')
      ]);

      renderDashboard(clientes, servicos, orcamentos);
      renderClientes(clientes);
      renderServicosAdmin(servicos);
    }

    async function fetchData(table, filters = '') {
      return fetch(`${SUPABASE_URL}/rest/v1/${table}${filters ? `?${filters}` : ''}&order=created_at.desc`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      }).then(r => r.json());
    }

    function renderDashboard(clientes, servicos, orcamentos) {
      const hoje = new Date().toISOString().split('T')[0];
      document.getElementById('totalClientes').textContent = clientes.length;
      document.getElementById('hoje').textContent = servicos.filter(s => s.data === hoje).length;
      document.getElementById('pendentes').textContent = orcamentos.filter(o => o.status === 'pendente').length;
      document.getElementById('faturamento').textContent = `R$ ${servicos.reduce((sum, s) => sum + (parseFloat(s.valor) || 0), 0).toFixed(2)}`;
    }

    function renderClientes(clientes) {
      document.getElementById('clientesTable').innerHTML = clientes.map(c => `
        <tr>
          <td>${c.nome}</td>
          <td>${c.email}</td>
          <td>${c.telefone}</td>
          <td>${c.servico}</td>
          <td>${new Date(c.created_at).toLocaleDateString()}</td>
          <td>
            <a href="mailto:${c.email}" class="btn btn-small btn-primary">📧</a>
            <button class="btn btn-small btn-danger" onclick="deleteItem('clientes', ${c.id})">🗑️</button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="6">Nenhum cliente</td></tr>';
    }

    function renderServicosAdmin(servicos) {
      document.getElementById('servicosAdminTable').innerHTML = servicos.map(s => `
        <tr>
          <td>${s.cliente_email}</td>
          <td>${s.servico}</td>
          <td>${s.data || '---'}</td>
          <td><span class="badge badge-${s.status}">${s.status}</span></td>
          <td>R$ ${(s.valor || 0).toFixed(2)}</td>
        </tr>
      `).join('') || '<tr><td colspan="5">Nenhum serviço</td></tr>';
    }

    async function gerarPDF(periodo) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      doc.setFontSize(20);
      doc.text(`Relatório ${periodo.toUpperCase()}`, 20, 20);
      doc.setFontSize(12);
      doc.text(`Gerado: ${new Date().toLocaleString('pt-BR')}`, 20, 35);
      
      const clientes = await fetchData('clientes');
      doc.text(`Total Clientes: ${clientes.length}`, 20, 50);
      
      const servicos = await fetchData('servicos');
      doc.text(`Total Serviços: ${servicos.length}`, 20, 65);
      doc.text(`Faturamento: R$ ${servicos.reduce((sum, s) => sum + (parseFloat(s.valor) || 0), 0).toFixed(2)}`, 20, 80);
      
      doc.save(`relatorio-${periodo}-${new Date().toISOString().slice(0,10)}.pdf`);
    }

    async function exportCSV() {
      const clientes = await fetchData('clientes');
      const csv = 'Nome,Email,Telefone,Serviço,Data
' + 
        clientes.map(c => `"${c.nome}","${c.email}","${c.telefone}","${c.servico}","${c.created_at}"`).join('
');
      
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'clientes.csv';
      a.click();
    }

    async function deleteItem(table, id) {
      if (confirm('Excluir permanentemente?')) {
        await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ deleted_at: new Date().toISOString() })
        });
        loadAdmin();
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    // NAVEGAÇÃO
    document.querySelectorAll('.nav-link[data-section]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(link.dataset.section).classList.add('active');
        link.classList.add('active');
      });
    });

    // INICIAR
    loadAdmin();
  </script>
</body>
</html>
