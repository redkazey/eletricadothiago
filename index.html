<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiago Pires - Eletricista</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="center-wrapper">
      <div class="card login-card">
        <div class="login-header">
          <div class="icon-bolt-large">⚡</div>
          <h1>Thiago Pires</h1>
          <p>Acesse sua conta</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Seu email de cadastro" required>
          </div>

          <div class="form-group">
            <label>Senha</label>
            <div class="password-container">
              <input type="password" name="senha" id="senhaInput" placeholder="Sua senha" required minlength="6">
              <button type="button" class="show-password" onclick="togglePassword()">👁</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary full">ENTRAR</button>
        </form>

        <div class="login-footer">
          <p>Não tem cadastro? <a href="cadastro.html">Faça seu cadastro</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 👁 MOSTRAR SENHA
    function togglePassword() {
      const senhaInput = document.getElementById('senhaInput');
      const btn = event.target;
      senhaInput.type = senhaInput.type === 'password' ? 'text' : 'password';
      btn.textContent = senhaInput.type === 'password' ? '👁' : '🙈';
    }

    // 🔐 LOGIN REAL - ADMIN OU CLIENTE
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.querySelector('input[name="email"]').value.trim().toLowerCase();
      const senha = document.querySelector('input[name="senha"]').value;
      
      // ADMIN SECRETO
      if (email === 'admin@thiago22' && senha === 'thiago22') {
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('userType', 'admin');
        window.location.href = 'painel.html';
        return;
      }
      
      // CLIENTE - VERIFICA BANCO D1
      try {
        const response = await fetch('https://api-thiago-pires.YOUR_WORKER.workers.dev/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha: btoa(senha) })
        });
        const result = await response.json();
        
        if (result.success) {
          localStorage.setItem('clientLoggedIn', 'true');
          localStorage.setItem('clientId', result.cliente.id);
          localStorage.setItem('clientEmail', result.cliente.email);
          localStorage.setItem('userType', 'client');
          window.location.href = 'cliente.html';
        } else {
          alert('❌ Email ou senha incorretos!');
        }
      } catch(e) {
        alert('❌ Erro de conexão. Tente novamente.');
      }
    });
  </script>
</body>
</html>
