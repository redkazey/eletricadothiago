<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiago Pires | Eletricista Profissional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gray-900 text-white">

  <!-- Navegação -->
  <nav class="p-5 bg-[#151520] border-b border-gray-800">
    <h1 class="font-bold text-xl text-green-400">Thiago Pires</h1>
  </nav>

  <main class="p-6 max-w-6xl mx-auto">

    <!-- Formulário de Cadastro -->
    <section id="sec-cad" class="py-12">
      <h2 class="text-3xl font-bold text-center text-green-400 mb-6">Cadastro de Novo Cliente</h2>
      <input type="text" id="cad-nome" placeholder="Nome Completo" class="w-full p-4 rounded-xl mb-4 text-sm">
      <input type="email" id="cad-email" placeholder="E-mail" class="w-full p-4 rounded-xl mb-4 text-sm">
      <input type="password" id="cad-senha" placeholder="Sua Senha" class="w-full p-4 rounded-xl mb-4 text-sm">
      <button onclick="salvarNovoCliente()" class="w-full bg-green-500 text-black p-4 rounded-xl">Cadastrar</button>
    </section>

    <!-- Formulário de Login -->
    <section id="sec-login" class="py-12">
      <h2 class="text-3xl font-bold text-center text-green-400 mb-6">Área de Acesso</h2>
      <input type="email" id="login-email" placeholder="E-mail" class="w-full p-4 rounded-xl mb-4 text-sm">
      <input type="password" id="login-senha" placeholder="Sua Senha" class="w-full p-4 rounded-xl mb-4 text-sm">
      <button onclick="realizarLogin()" class="w-full bg-green-500 text-black p-4 rounded-xl">Entrar</button>
    </section>

    <!-- Página do Cliente -->
    <section id="sec-cliente" class="hidden space-y-6">
      <div class="bg-gradient-to-r from-green-900/20 to-transparent p-8 rounded-3xl border border-green-900/30">
        <h2 class="text-3xl font-bold">Bem-vindo, <span id="client-name" class="text-green-400"></span>!</h2>
        <p class="text-gray-400 mt-2">Escolha abaixo o melhor horário para seu serviço elétrico.</p>
      </div>
      <input type="text" id="data-agendamento" class="w-full p-5 rounded-2xl mb-6 text-lg font-bold text-center" placeholder="Selecione a data">
      <button onclick="agendar()" class="w-full bg-green-500 text-black p-5 rounded-2xl text-lg">Agendar Serviço</button>
    </section>
  </main>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
