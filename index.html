<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiago Pires - Eletricista</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="center-wrapper">
      <div class="card login-card">
        <div class="login-header">
          <div class="icon-bolt-large">⚡</div>
          <h1>Thiago Pires</h1>
          <p>Acesse sua conta</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email *</label>
            <input type="email" name="email" placeholder="admin@thiagopires.com ou seu email" required>
          </div>
          <div class="form-group">
            <label>Senha *</label>
            <input type="password" name="senha" placeholder="Digite sua senha" required>
          </div>
          <button type="submit" class="btn btn-primary full">ENTRAR</button>
        </form>

        <div class="login-footer">
          <p>Não tem cadastro? <a href="cadastro.html">Faça seu cadastro</a></p>
          <p><strong>👨‍💼 Admin:</strong> admin@thiagopires.com (qualquer senha)</p>
          <p><small>🔐 Logout auto: 10 min inatividade</small></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 🔥 LOGOUT 10 MINUTOS
    let inactivityTimer;
    function resetTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(logoutAuto, 10 * 60 * 1000);
    }
    function logoutAuto() {
      localStorage.clear();
      alert('🔐 Sessão expirada (10 min)');
      window.location.href = 'index.html';
    }
    ['mousedown','mousemove','keypress','scroll','touchstart','touchmove'].forEach(e=>document.addEventListener(e,resetTimer,true));
    resetTimer();

    // 🔒 LOGIN ADMIN vs CLIENTE
    document.getElementById('loginForm').addEventListener('submit',function(e){
      e.preventDefault();
      const email=document.querySelector('input[name="email"]').value.trim().toLowerCase();
      const senha=document.querySelector('input[name="senha"]').value;
      
      if(email==='admin@thiagopires.com'){
        localStorage.setItem('adminLoggedIn','true');localStorage.setItem('userType','admin');
        alert('✅ Admin OK!');window.location.href='painel.html';
      }else{
        localStorage.setItem('clientLoggedIn','true');localStorage.setItem('clientEmail',email);
        localStorage.setItem('userType','client');localStorage.setItem('clientSenha',btoa(senha));
        alert('✅ Painel Cliente!');window.location.href='cliente.html';
      }
    });
    document.addEventListener('keypress',e=>e.key==='Enter'?document.getElementById('loginForm').dispatchEvent(new Event('submit')):0);
  </script>
</body>
</html>
