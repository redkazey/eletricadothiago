<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago Pires | Elétrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net"></script>
    <script src="https://cdn.jsdelivr.net/dist/l10n/pt.js"></script>
    <style>
        :root { --neon: #00ff88; --bg: #0a0a0f; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; }
        .neon-text { color: var(--neon); text-shadow: 0 0 10px rgba(0, 255, 136, 0.4); }
        .neon-border { border: 1px solid #2a2a35; }
        .neon-border:focus-within { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        .btn-neon { background: var(--neon); color: black; font-weight: bold; transition: 0.3s; }
        .btn-neon:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--neon); }
        input, select { background: #151520 !important; border: 1px solid #2a2a35 !important; color: white !important; }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="p-4 border-b border-gray-800 flex justify-between items-center backdrop-blur-md sticky top-0 z-50">
        <div>
            <h1 class="font-bold text-xl neon-text">THIAGO PIRES</h1>
            <span class="text-[10px] text-gray-500">CNPJ: 61.465.616/0001-22</span>
        </div>
        <button id="logout-btn" onclick="logout()" class="hidden text-xs text-red-500 border border-red-900 px-3 py-1 rounded">SAIR</button>
    </nav>

    <!-- CONTAINER PRINCIPAL -->
    <main class="p-6 max-w-6xl mx-auto">

        <!-- LOGIN -->
        <section id="sec-login" class="flex flex-col items-center py-20">
            <div class="bg-[#151520] p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl">
                <h2 class="text-2xl font-bold mb-6 text-center">Acessar Sistema</h2>
                <input type="email" id="login-email" placeholder="E-mail" class="w-full p-4 rounded-xl mb-4">
                <input type="password" id="login-pass" placeholder="Senha" class="w-full p-4 rounded-xl mb-6">
                <button onclick="realizarLogin()" class="w-full btn-neon p-4 rounded-xl">ENTRAR</button>
                <p class="text-sm mt-4 text-center text-gray-500">É novo? <button onclick="showSec('sec-cad')" class="text-green-400">Cadastre-se</button></p>
            </div>
        </section>

        <!-- CADASTRO -->
        <section id="sec-cad" class="hidden">
            <div class="bg-[#151520] p-8 rounded-2xl border border-gray-800 max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 neon-text">Cadastro de Cliente</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="cad-nome" placeholder="Nome Completo" class="w-full p-3 rounded-lg">
                    <input type="text" id="cad-cpf" placeholder="CPF" class="w-full p-3 rounded-lg" oninput="fCPF(this)" maxlength="14">
                    <input type="text" id="cad-cep" placeholder="CEP" class="w-full p-3 rounded-lg" onblur="apiCEP(this.value)">
                    <input type="text" id="cad-rua" placeholder="Endereço" class="w-full p-3 rounded-lg bg-gray-900" readonly>
                    <input type="text" id="cad-num" placeholder="Número" class="w-full p-3 rounded-lg">
                    <input type="password" id="cad-pass" placeholder="Criar Senha" class="w-full p-3 rounded-lg">
                </div>
                <button onclick="salvarNovoCliente()" class="w-full btn-neon p-4 rounded-lg mt-6">CADASTRAR</button>
            </div>
        </section>

        <!-- PAINEL ADM -->
        <section id="sec-adm" class="hidden space-y-6">
            <h2 class="text-3xl font-bold neon-text">Painel Administrativo</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Materiais -->
                <div class="bg-[#151520] p-5 rounded-xl border border-gray-800">
                    <h3 class="font-bold mb-4">📦 Materiais</h3>
                    <input type="text" id="adm-mat-nome" placeholder="Nome" class="w-full p-2 rounded mb-2 text-sm">
                    <input type="number" id="adm-mat-preco" placeholder="Preço" class="w-full p-2 rounded mb-2 text-sm">
                    <button onclick="addItem('materiais')" class="w-full bg-green-600 text-black text-xs font-bold p-2 rounded">ADICIONAR</button>
                    <div id="lista-materiais" class="mt-4 space-y-2 max-h-40 overflow-y-auto"></div>
                </div>
                <!-- Agenda -->
                <div class="bg-[#151520] p-5 rounded-xl border border-gray-800">
                    <h3 class="font-bold mb-4">📅 Agenda</h3>
                    <button onclick="toggleF()" id="btn-ferias" class="w-full p-2 rounded text-xs font-bold mb-4"></button>
                    <div id="lista-agenda-adm" class="space-y-2 text-xs"></div>
                </div>
                <!-- Clientes -->
                <div class="bg-[#151520] p-5 rounded-xl border border-gray-800">
                    <h3 class="font-bold mb-4">👥 Clientes</h3>
                    <div id="lista-clientes-adm" class="space-y-2 text-xs"></div>
                </div>
            </div>
        </section>

        <!-- PAINEL CLIENTE -->
        <section id="sec-cliente" class="hidden space-y-6">
            <h2 class="text-2xl font-bold">Olá, <span id="client-name" class="neon-text"></span></h2>
            <div class="bg-[#151520] p-6 rounded-2xl border border-gray-800">
                <h3 class="font-bold mb-4">Novo Agendamento</h3>
                <input type="text" id="data-agendamento" class="w-full p-4 rounded-xl mb-4" placeholder="Escolha data e hora">
                <button onclick="agendar()" class="w-full btn-neon p-4 rounded-xl">SOLICITAR VIA WHATSAPP</button>
                <p class="text-[10px] text-gray-500 mt-2">Cancelamentos permitidos até 24h antes.</p>
            </div>
        </section>

    </main>

    <script>
        // CONFIG - INSIRA SEUS DADOS AQUI
        const GITHUB = {
            token: 'SEU_TOKEN_AQUI',
            repo: 'SEU_USUARIO/SEU_REPO',
            path: 'database.json',
            adm: { email: 'admin@thiago22', hash: '$2a$10$N9qo8uLOickgx2ZMRZoMy.v0JpGgB2.y3B3E/L2Zq7m6.k6p6M6mC' }
        };

        let db = { clientes: [], agendamentos: [], materiais: [], config: { modoFerias: false } };
        let currentUser = null;

        // INÍCIO
        async function load() {
            const r = await fetch(`https://api.github.com{GITHUB.repo}/contents/${GITHUB.path}`, {
                headers: { 'Authorization': `token ${GITHUB.token}` }
            });
            const d = await r.json();
            db = JSON.parse(decodeURIComponent(escape(atob(d.content))));
            db.sha = d.sha;
            renderAll();
        }

        async function sync() {
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
            await fetch(`https://api.github.com{GITHUB.repo}/contents/${GITHUB.path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Update", content, sha: db.sha })
            });
            load();
        }

        // AUTH
        function realizarLogin() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;

            if(e === GITHUB.adm.email && dcodeIO.bcrypt.compareSync(p, GITHUB.adm.hash)) {
                showSec('sec-adm');
                document.getElementById('logout-btn').classList.remove('hidden');
                return;
            }

            const c = db.clientes.find(u => u.email === e && u.pass === p);
            if(c) {
                currentUser = c;
                document.getElementById('client-name').innerText = c.nome;
                showSec('sec-cliente');
                document.getElementById('logout-btn').classList.remove('hidden');
                initCalendar();
            } else { alert("Falha no login!"); }
        }

        // AUXILIARES
        function showSec(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function fCPF(i) {
            let v = i.value.replace(/\D/g, "");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d)/, "$1.$2");
            v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            i.value = v;
        }

        async function apiCEP(v) {
            const r = await fetch(`https://viacep.com.br{v}/json/`);
            const d = await r.json();
            document.getElementById('cad-rua').value = d.logradouro || "CEP Inválido";
        }

        function initCalendar() {
            flatpickr("#data-agendamento", {
                enableTime: true,
                dateFormat: "d/m/Y H:i",
                minDate: "today",
                locale: "pt",
                disable: [date => db.config.modoFerias || date.getDay() === 0],
                minTime: "08:00", maxTime: "18:00"
            });
        }

        // REGRAS ADM
        async function addItem(tipo) {
            const nome = document.getElementById(`adm-mat-nome`).value;
            const preco = document.getElementById(`adm-mat-preco`).value;
            db[tipo].push({ id: Date.now(), nome, preco });
            await sync();
        }

        async function toggleF() {
            db.config.modoFerias = !db.config.modoFerias;
            await sync();
        }

        function renderAll() {
            const matDiv = document.getElementById('lista-materiais');
            matDiv.innerHTML = db.materiais.map(m => `<div class="text-xs flex justify-between"><span>${m.nome}</span> <b>R$${m.preco}</b></div>`).join('');
            
            const btnF = document.getElementById('btn-ferias');
            btnF.innerText = db.config.modoFerias ? "MODO FÉRIAS: ATIVO" : "MODO TRABALHO: ATIVO";
            btnF.className = db.config.modoFerias ? "w-full p-2 rounded text-xs font-bold mb-4 bg-red-600" : "w-full p-2 rounded text-xs font-bold mb-4 bg-green-600";
            
            document.getElementById('lista-clientes-adm').innerHTML = db.clientes.map(c => `<div>${c.nome}</div>`).join('');
        }

        function agendar() {
            const data = document.getElementById('data-agendamento').value;
            const msg = `Olá Thiago! Sou ${currentUser.nome}. Agendamento para: ${data}`;
            window.open(`https://wa.me{encodeURIComponent(msg)}`);
        }

        function logout() { location.reload(); }

        load();
    </script>
</body>
</html>
