<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiago Pires - Eletricista</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- EFEITOS DE FUNDO -->
  <div class="background-effects">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">⚡</div>
        <h2>Thiago Pires</h2>
        <p>Acesse sua conta</p>
      </div>

      <form id="loginForm">
        <div class="input-wrapper">
          <input type="email" id="email" name="email" required>
          <label for="email">Email</label>
        </div>

        <div class="input-wrapper password-wrapper">
          <input type="password" id="senha" name="senha" required>
          <label for="senha">Senha</label>
          <button type="button" class="password-toggle" id="toggleSenha" tabindex="-1">
            <span class="toggle-icon" id="eyeIcon">👁️</span>
          </button>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-glow"></span>
          <span class="btn-text">ENTRAR</span>
          <div class="btn-loader"></div>
        </button>
      </form>

      <div class="divider neon-divider">
        <span></span>
      </div>

      <div class="signup-link">
        <p>Novo cliente? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </div>
  </div>

  <script>
    // Toggle senha VISÍVEL/INVISÍVEL
    document.getElementById('toggleSenha').addEventListener('click', function(e) {
      e.preventDefault();
      const senhaInput = document.getElementById('senha');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (senhaInput.type === 'password') {
        senhaInput.type = 'text';
        eyeIcon.textContent = '🙈';
      } else {
        senhaInput.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    });

    // Detecta quando input tem valor para mover label
    function handleInput(input) {
      if (input.value.length > 0) {
        input.classList.add('has-value');
      } else {
        input.classList.remove('has-value');
      }
    }

    document.getElementById('email').addEventListener('input', function() {
      handleInput(this);
    });

    document.getElementById('senha').addEventListener('input', function() {
      handleInput(this);
    });

    // Login form - ADMIN
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      
      // Validação básica
      if (!email || !senha) {
        alert('Preencha email e senha');
        btn.classList.remove('loading');
        return;
      }
      
      btn.classList.add('loading');
      
      // Simula login ADMIN (substitua pela sua API real)
      setTimeout(() => {
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'painel.html';
      }, 1500);
    });
  </script>
</body>
</html>
